<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Cat 1 — Tribunes principales">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0d1528"/>
    </linearGradient>
    <linearGradient id="grass1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f7a3a"/>
      <stop offset="50%" stop-color="#2f9e4f"/>
      <stop offset="100%" stop-color="#1f7a3a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#00ff85" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00ff85" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#sky1)"/>
  <!-- stadium tiers -->
  <ellipse cx="320" cy="210" rx="290" ry="165" fill="#2a3348"/>
  <ellipse cx="320" cy="210" rx="255" ry="145" fill="#353f56"/>
  <ellipse cx="320" cy="210" rx="220" ry="125" fill="#3f4a64"/>
  <ellipse cx="320" cy="210" rx="185" ry="105" fill="#4a5670"/>
  <ellipse cx="320" cy="210" rx="150" ry="85" fill="#55607c"/>
  <!-- pitch -->
  <ellipse cx="320" cy="210" rx="115" ry="62" fill="url(#grass1)"/>
  <ellipse cx="320" cy="210" rx="115" ry="62" fill="none" stroke="#cfe9d6" stroke-width="2" opacity="0.5"/>
  <line x1="320" y1="148" x2="320" y2="272" stroke="#cfe9d6" stroke-width="1.5" opacity="0.45"/>
  <ellipse cx="320" cy="210" rx="28" ry="16" fill="none" stroke="#cfe9d6" stroke-width="1.5" opacity="0.45"/>
  <!-- highlighted category ring -->
  <ellipse cx="320" cy="210" rx="250" ry="99" fill="none" stroke="#00ff85" stroke-width="10" opacity="0.85"/>
  <ellipse cx="320" cy="210" rx="250" ry="99" fill="url(#glow1)"/>
  <!-- seat marker -->
  <g transform="translate(320 138)">
    <circle r="10" fill="#00ff85"/>
    <circle r="4" fill="#37003c"/>
  </g>
  <!-- caption bar -->
  <rect x="0" y="340" width="640" height="60" fill="#0a0f1a" opacity="0.85"/>
  <text x="320" y="365" text-anchor="middle" fill="#fff" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18" font-weight="700">Cat 1 — Tribunes principales</text>
  <text x="320" y="388" text-anchor="middle" fill="#9ad9b4" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="13">Vue terrain · 1er rang tribunes</text>
</svg>