<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Paiement — Prime Football</title>
  <link rel="canonical" href="https://primeleaguetickets.com/thank-you" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=109" />
</head>
<body>
  <div id="chrome-top"></div>
  <main id="page-main" class="page-doc">
    <div class="shell">
      <article class="legal-content">
        <p class="legal-content__eyebrow">Prime Football</p>
        <h1>Paiement</h1>
        <p class="legal-content__lead" id="thank-lead">On confirme ton paiement.</p>
        <div id="order-root"></div>
      </article>
    </div>
  </main>
  <div id="chrome-bottom"></div>
  <script src="i18n.js?v=10"></script>
  <script src="data.js?v=56"></script>
  <script src="qrcode.js?v=1"></script>
  <script src="tickets.js?v=8"></script>
  <script src="chrome.js?v=2"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const lead = document.getElementById("thank-lead");
    const root = document.getElementById("order-root");
    const commande = params.get("commande");
    const key = params.get("key");

    function viderPanier() {
      localStorage.removeItem("prime-football-cart");
      localStorage.removeItem("prime-football-hold");
      if (typeof bindCartUI === "function") bindCartUI();
    }

    async function lire() {
      if (!commande || !key) {
        lead.textContent = "Cette page s'ouvre après le paiement.";
        return true;
      }
      const res = await fetch(`/api/merci?commande=${encodeURIComponent(commande)}&key=${encodeURIComponent(key)}`);
      const payload = await res.json().catch(() => ({}));
      if (!res.ok) {
        lead.textContent = "Commande introuvable.";
        return true;
      }
      if (!payload.paid) {
        lead.textContent = "Le paiement est en cours de confirmation. Tes e-billets arrivent par e-mail.";
        return false;
      }
      lead.textContent = payload.order.test
        ? "Paiement test confirmé. La facture et les e-billets partent par e-mail. Scanne le QR."
        : "Paiement confirmé. Tes e-billets partent aussi par e-mail.";
      root.innerHTML = orderBlock(payload.order);
      viderPanier();
      return true;
    }

    (async () => {
      for (let i = 0; i < 8; i += 1) {
        const fini = await lire().catch(() => false);
        if (fini) return;
        await new Promise((resolve) => setTimeout(resolve, 3000));
      }
    })();
  </script>
</body>
</html>
