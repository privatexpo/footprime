<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Contact — Prime Football</title>
  <link rel="canonical" href="https://www.primeleaguetickets.com/contact.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=108" />
</head>
<body>
  <div id="chrome-top"></div>
  <main id="page-main" class="page-doc">
    <div class="shell">
      <article class="legal-content contact-page">
        <h1 class="contact-title">
          <svg class="contact-title__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="17" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 7.5 12 13l8-5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Contact
        </h1>
        <p class="legal-content__lead">Une question sur ta commande ou un match&nbsp;?</p>
        <ul class="contact-list">
          <li>
            <span class="contact-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 7.5 12 13l8-5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <div>
              <p>E-mail</p>
              <a href="mailto:mail@primeworldtickets.com">mail@primeworldtickets.com</a>
            </div>
          </li>
          <li>
            <span class="contact-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 12h16M12 4c2.2 2.4 3.3 5.1 3.3 8S14.2 17.6 12 20c-2.2-2.4-3.3-5.1-3.3-8S9.8 6.4 12 4z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span>
            <div>
              <p>Site</p>
              <a href="https://www.primeleaguetickets.com">primeleaguetickets.com</a>
            </div>
          </li>
          <li>
            <span class="contact-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.5 8.5A2 2 0 0 1 6.5 6.5h11a2 2 0 0 1 2 2v1.8a1.7 1.7 0 0 0 0 3.4v1.8a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2v-1.8a1.7 1.7 0 0 0 0-3.4V8.5z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span>
            <div>
              <p>Billets</p>
              <a href="billets.html">Retrouver tes billets</a>
            </div>
          </li>
        </ul>
        <form class="contact-form" id="contact-form">
          <label>
            <span class="contact-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 19.2c1.2-2.6 3.5-3.9 6.5-3.9s5.3 1.3 6.5 3.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Nom</span>
            <input name="name" required placeholder="Ton nom" />
          </label>
          <label>
            <span class="contact-field"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="17" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 7.5 12 13l8-5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>E-mail</span>
            <input type="email" name="email" required placeholder="toi@email.com" />
          </label>
          <label>
            <span class="contact-field"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7.5L19 8v12.5H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3.5V8h5M9.5 12.5h6M9.5 16h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>N° commande</span>
            <input name="order" placeholder="PF-000000" />
          </label>
          <label>
            <span class="contact-field"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7.5h8M7 4.5h10a2 2 0 0 1 2 2v8.2a2 2 0 0 1-2 2H11l-4 3v-3H7a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Sujet</span>
            <select name="topic" required><option value="">Choisir…</option><option>Billet non reçu</option><option>Annulation</option><option>Match reporté</option><option>Paiement</option><option>Autre</option></select>
          </label>
          <label>
            <span class="contact-field"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5h14v9H8.5L5 18.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Message</span>
            <textarea name="message" rows="5" required placeholder="Explique-nous ce qui se passe"></textarea>
          </label>
          <button type="submit" class="btn-primary contact-send">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12 19 5.5 14 19.5l-2.2-6.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            Envoyer
          </button>
          <p class="legal-note" id="contact-toast" hidden>Message prêt. Écris-nous à mail@primeworldtickets.com avec ton n° de commande.</p>
        </form>
      </article>
      <script>
        document.getElementById("contact-form")?.addEventListener("submit", (event) => {
          event.preventDefault();
          const note = document.getElementById("contact-toast");
          if (note) note.hidden = false;
          event.currentTarget.reset();
        });
      </script>
    </div>
  </main>
  <div id="chrome-bottom"></div>
  <script src="i18n.js?v=8"></script>
  <script src="data.js?v=56"></script>
  <script src="chrome.js?v=2"></script>
</body>
</html>
