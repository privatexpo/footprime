<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mes billets — Prime Football</title>
  <link rel="canonical" href="https://www.primeworldtickets.com/billets.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=107" />
</head>
<body>
  <div id="chrome-top"></div>
  <main id="page-main" class="page-doc">
    <div class="shell">
      <article class="legal-content lookup-page">
        <h1 data-i18n="order.find">Retrouver mes billets</h1>
        <p class="legal-content__lead" data-i18n="order.findLead">Entre l’e-mail de la commande et le code reçu par e-mail.</p>
        <form class="lookup-form lookup-form--stack" id="lookup-form">
          <label>
            <span data-i18n="checkout.email">E-mail</span>
            <input type="email" name="email" required autocomplete="email" placeholder="toi@email.com" />
          </label>
          <label>
            <span data-i18n="order.mailCode">Code envoyé par e-mail</span>
            <input type="text" name="code" required autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="PF-000000" />
          </label>
          <button type="submit" class="btn-primary" data-i18n="order.search">Retrouver mes billets</button>
        </form>
        <div id="lookup-root"></div>
      </article>
    </div>
  </main>
  <div id="chrome-bottom"></div>
  <script src="i18n.js?v=8"></script>
  <script src="data.js?v=56"></script>
  <script src="qrcode.js?v=1"></script>
  <script src="tickets.js?v=4"></script>
  <script src="orders-ui.js?v=5"></script>
  <script src="chrome.js?v=2"></script>
</body>
</html>
